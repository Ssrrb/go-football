root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/web ./cmd/web"
bin = "tmp/web"
include_ext = ["go", "html", "css", "js"]
include_dir = ["cmd", "internal"]
exclude_dir = [".git", ".venv", "data/raw", "etl", "tmp"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
