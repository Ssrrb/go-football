[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go-football-sources"
version = "0.1.0"
description = "Source adapters for Paraguayan Primera Division data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
go-football-sources = "go_football_sources.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

